          # Zeigt Überschuss, /690-Zielstrom, tatsächlichen Sollstrom und kontrolliert,
          # dass der interne Tuya-PV-Regler wirklich ausgeschaltet bleibt.
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 🔌 Wallbox PV-Regelung
                  **Eigene Home-Assistant-Regelung · 3-phasig / 690**
              - type: entities
                entities:
                  - entity: sensor.wallbox_pv_ueberschuss_fuer_auto
                    name: Verfügbarer Überschuss fürs Auto
                    icon: mdi:solar-power
                  - entity: sensor.wallbox_pv_zielstrom_3_phasig
                    name: Zielstrom eigene Regelung
                    icon: mdi:current-ac
                  - entity: number.tuya_ev_charger_current_setpoint
                    name: Tatsächlicher Sollstrom
                    icon: mdi:ev-station
                  - entity: sensor.tuya_ev_charger_total_power
                    name: Aktuelle Ladeleistung
                    icon: mdi:flash
                  - entity: input_boolean.wallbox_pv_automatik
                    name: Eigene PV-Automatik
                    icon: mdi:home-automation
                  - entity: switch.tuya_ev_charger_solar_surplus_mode
                    name: Interner Tuya-PV-Regler (muss AUS sein)
                    icon: mdi:cog-off
              - type: markdown
                content: >
                  {% set ziel =
