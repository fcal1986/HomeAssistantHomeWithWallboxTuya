title: Zuhause
kiosk_mode:
  non_admin_settings:
    hide_sidebar: true
    hide_menubutton: true
    hide_search: true
    hide_assistant: true
    hide_overflow: true
    hide_account: true
    hide_notifications: true
views:
  - title: Start
    path: start
    icon: mdi:home-variant
    type: sections
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: >-
          {%- set h = now().hour -%}

          {%- set rm =
          expand('binary_sensor.eg_flur_haustur_rauch','binary_sensor.eg_flur_treppe_rauch','binary_sensor.eleano_rauch','binary_sensor.mattia_rauch','binary_sensor.og_flur_rauch')
          -%}

          {%- set alarm = rm | selectattr('state','eq','on') | list -%}

          {%- set weg = rm | rejectattr('state','in',['on','off']) | list -%}

          {%- set w = states('weather.forecast_home') -%}

          {%- set m =
          {'clear-night':'Klar','cloudy':'Bewölkt','fog':'Nebel','hail':'Hagel','lightning':'Gewitter','lightning-rainy':'Gewitter
          mit Regen','partlycloudy':'Teilweise bewölkt','pouring':'Starker
          Regen','rainy':'Regen','snowy':'Schnee','snowy-rainy':'Schneeregen','sunny':'Sonnig','windy':'Windig','windy-variant':'Windig','exceptional':'Unwetter'}
          -%}

          ## {% if h < 5 %}Gute Nacht{% elif h < 11 %}Guten Morgen{% elif h < 14
          %}Guten Tag{% elif h < 18 %}Schönen Nachmittag{% else %}Guten Abend{%
          endif %}


          {% if alarm | count > 0 %}🔥 **Rauch erkannt – {{ alarm |
          map(attribute='name') | join(', ') }}**{% elif weg | count > 0 %}⚠️ {{
          weg | count }} Rauchmelder nicht erreichbar{% else %}✓ Zuhause ist
          alles in Ordnung{% endif %} · {{ m.get(w, w) }}, {{
          state_attr('weather.forecast_home','temperature') | round(0) }} °C ·
          {{ 'Fabrizio zuhause' if is_state('person.fabrizio_calcagno','home')
          else 'Fabrizio unterwegs' }}
    badges:
      - type: entity
        entity: weather.forecast_home
        name: Wetter
        show_name: false
        state_content:
          - state
          - temperature
        color: blue
      - type: entity
        entity: person.fabrizio_calcagno
        name: Fabrizio
        show_name: true
        color: green
      - type: entity
        entity: sensor.stp10_0_3av_40_278_pv_power
        name: PV erzeugt
        show_name: true
        icon: mdi:solar-power-variant
        color: amber
      - type: entity
        entity: binary_sensor.rpi_power_status
        name: Stromversorgung Server
        show_name: true
        color: red
        visibility:
          - condition: state
            entity: binary_sensor.rpi_power_status
            state: 'on'
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:mushroom-template-card
            primary: RAUCHALARM
            secondary: >-
              {% set rm =
              expand('binary_sensor.eg_flur_haustur_rauch','binary_sensor.eg_flur_treppe_rauch','binary_sensor.eleano_rauch','binary_sensor.mattia_rauch','binary_sensor.og_flur_rauch')
              %}{{ rm | selectattr('state','eq','on') | map(attribute='name') |
              join(', ') }}
            icon: mdi:fire-alert
            icon_color: red
            multiline_secondary: true
            tap_action:
              action: navigate
              navigation_path: '#sicherheit'
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.eg_flur_haustur_rauch
                    state: 'on'
                  - condition: state
                    entity: binary_sensor.eg_flur_treppe_rauch
                    state: 'on'
                  - condition: state
                    entity: binary_sensor.eleano_rauch
                    state: 'on'
                  - condition: state
                    entity: binary_sensor.mattia_rauch
                    state: 'on'
                  - condition: state
                    entity: binary_sensor.og_flur_rauch
                    state: 'on'
            card_mod:
              style: |
                ha-card {
                  border-radius: 24px;
                  background: rgba(244, 67, 54, 0.15);
                  border: 1px solid rgba(244, 67, 54, 0.5);
                  --card-primary-font-size: 20px;
                  --card-primary-font-weight: 700;
                  --card-primary-color: #f44336;
                }
          - type: custom:mushroom-chips-card
            alignment: start
            grid_options:
              columns: full
            chips:
              - type: template
                icon: mdi:shield-check
                icon_color: >-
                  {% set rm =
                  expand('binary_sensor.eg_flur_haustur_rauch','binary_sensor.eg_flur_treppe_rauch','binary_sensor.eleano_rauch','binary_sensor.mattia_rauch','binary_sensor.og_flur_rauch')
                  %}{% if rm | selectattr('state','eq','on') | list | count > 0
                  %}red{% elif rm | rejectattr('state','in',['on','off']) | list
                  | count > 0 %}orange{% else %}green{% endif %}
                content: >-
                  {% set rm =
                  expand('binary_sensor.eg_flur_haustur_rauch','binary_sensor.eg_flur_treppe_rauch','binary_sensor.eleano_rauch','binary_sensor.mattia_rauch','binary_sensor.og_flur_rauch')
                  %}{% set ok = rm | selectattr('state','eq','off') | list |
                  count %}{% if rm | selectattr('state','eq','on') | list |
                  count > 0 %}RAUCHALARM{% elif ok < 5 %}Rauchmelder {{ ok }}/5
                  OK{% else %}Rauchmelder alle OK{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: '#sicherheit'
              - type: template
                icon: >-
                  {% set ns = namespace(l=[]) %}{% for e, n in
                  [('binary_sensor.vorne_rechts_bewegung','vorne
                  rechts'),('binary_sensor.vorne_links_bewegung','vorne
                  links'),('binary_sensor.hinterm_haus_duo_bewegung','hinterm
                  Haus'),('binary_sensor.west_bewegung','West')] %}{% if
                  is_state(e,'on') %}{% set ns.l = ns.l + [n] %}{% endif %}{%
                  endfor %}{{ 'mdi:motion-sensor' if ns.l | count > 0 else
                  'mdi:motion-sensor-off' }}
                icon_color: >-
                  {% set ns = namespace(l=[]) %}{% for e, n in
                  [('binary_sensor.vorne_rechts_bewegung','vorne
                  rechts'),('binary_sensor.vorne_links_bewegung','vorne
                  links'),('binary_sensor.hinterm_haus_duo_bewegung','hinterm
                  Haus'),('binary_sensor.west_bewegung','West')] %}{% if
                  is_state(e,'on') %}{% set ns.l = ns.l + [n] %}{% endif %}{%
                  endfor %}{{ 'orange' if ns.l | count > 0 else 'disabled' }}
                content: >-
                  {% set ns = namespace(l=[]) %}{% for e, n in
                  [('binary_sensor.vorne_rechts_bewegung','vorne
                  rechts'),('binary_sensor.vorne_links_bewegung','vorne
                  links'),('binary_sensor.hinterm_haus_duo_bewegung','hinterm
                  Haus'),('binary_sensor.west_bewegung','West')] %}{% if
                  is_state(e,'on') %}{% set ns.l = ns.l + [n] %}{% endif %}{%
                  endfor %}{{ 'Bewegung ' ~ (ns.l | join(', ')) if ns.l | count
                  > 0 else 'Draußen ruhig' }}
                tap_action:
                  action: navigate
                  navigation_path: /zuhause-neu/kameras
              - type: template
                icon: mdi:lightbulb-group
                icon_color: >-
                  {% set l =
                  expand('light.vorne_links_flutlicht','light.hinterm_haus_duo_flutlicht','light.west_flutlicht')
                  | selectattr('state','eq','on') | list | count %}{{ 'amber' if
                  l > 0 else 'disabled' }}
                content: >-
                  {% set l =
                  expand('light.vorne_links_flutlicht','light.hinterm_haus_duo_flutlicht','light.west_flutlicht')
                  | selectattr('state','eq','on') | list | count %}{{
                  'Außenlicht ' ~ l ~ '/3 an' if l > 0 else 'Außenlicht aus' }}
              - type: template
                icon: >-
                  {%- set s = states('sensor.tuya_ev_charger_status') -%} {%- if
                  is_state('binary_sensor.wallbox_fehler','on')
                  -%}mdi:alert-circle {%- elif
                  is_state('binary_sensor.wallbox_ladung_aktiv','on')
                  -%}mdi:battery-charging-high {%- elif s == 'charged'
                  -%}mdi:battery-check {%- elif
                  is_state('binary_sensor.wallbox_auto_angeschlossen','on')
                  -%}mdi:ev-plug-type2 {%- else -%}mdi:ev-station{%- endif -%}
                icon_color: >-
                  {%- set s = states('sensor.tuya_ev_charger_status') -%} {%- if
                  is_state('binary_sensor.wallbox_fehler','on') -%}red {%- elif
                  is_state('binary_sensor.wallbox_ladung_aktiv','on') -%}{{
                  'amber' if
                  is_state('switch.garage_tuya_ev_charger_force_charge','on')
                  else 'green' }} {%- elif s == 'charged' -%}green {%- elif s ==
                  'paused' -%}orange {%- elif
                  is_state('binary_sensor.wallbox_auto_angeschlossen','on')
                  -%}blue {%- else -%}disabled{%- endif -%}
                content: >-
                  {%- set s = states('sensor.tuya_ev_charger_status') -%} {%-
                  set p = states('sensor.tuya_ev_charger_total_power') |
                  float(0) -%} {%- if
                  is_state('binary_sensor.wallbox_fehler','on')
                  -%}Wallbox-Störung {%- elif
                  is_state('binary_sensor.wallbox_ladung_aktiv','on') -%}Auto
                  lädt {{ p | round(1) }} kW{{ ' · ⚡ Sofort' if
                  is_state('switch.garage_tuya_ev_charger_force_charge','on')
                  else (' · ☀️ PV' if
                  is_state('binary_sensor.wallbox_pv_ladung_aktiv','on') else
                  '') }} {%- elif s == 'charged' -%}Auto voll geladen {%- elif s
                  == 'paused' -%}Laden pausiert {%- elif s == 'waiting' -%}Auto
                  wartet auf Freigabe {%- elif
                  is_state('binary_sensor.wallbox_auto_angeschlossen','on')
                  -%}Auto angeschlossen {%- else -%}Wallbox bereit{%- endif -%}
                tap_action:
                  action: navigate
                  navigation_path: /zuhause-neu/energie
              - type: conditional
                conditions:
                  - entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
                    state_not: 'off'
                  - entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
                    state_not: unavailable
                  - entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
                    state_not: standby
                chip:
                  type: template
                  icon: mdi:television
                  icon_color: blue
                  content: Wohnzimmer-TV an
              - type: conditional
                conditions:
                  - entity: binary_sensor.rpi_power_status
                    state: 'on'
                chip:
                  type: template
                  icon: mdi:power-plug-off
                  icon_color: red
                  content: Stromversorgung prüfen
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Energie
            heading_style: title
            icon: mdi:lightning-bolt
          - type: custom:mushroom-template-card
            grid_options:
              columns: 4
            icon: mdi:solar-power-variant
            icon_color: >-
              {{ 'amber' if states('sensor.stp10_0_3av_40_278_pv_power') |
              float(0) > 50 else 'grey' }}
            primary: >-
              {% set p = states('sensor.stp10_0_3av_40_278_pv_power') | float(0)
              %}{% if p >= 1000 %}{{ (p / 1000) | round(2) }} kW{% else %}{{ p |
              round(0) | int }} W{% endif %}
            secondary: PV erzeugt
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: '#energie'
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  --card-primary-font-size: 18px;
                  --card-primary-font-weight: 700;
                  --card-secondary-font-size: 12px;
                }
          - type: custom:mushroom-template-card
            grid_options:
              columns: 4
            icon: mdi:home-lightning-bolt-outline
            icon_color: blue
            primary: >-
              {% set p = [ states('sensor.stp10_0_3av_40_278_pv_power') |
              float(0) + states('sensor.shellypro3em_38182bdee0e0_leistung') |
              float(0), 0 ] | max %}{% if p >= 1000 %}{{ (p / 1000) | round(2)
              }} kW{% else %}{{ p | round(0) | int }} W{% endif %}
            secondary: Haus braucht
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: '#energie'
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  --card-primary-font-size: 18px;
                  --card-primary-font-weight: 700;
                  --card-secondary-font-size: 12px;
                }
          - type: custom:mushroom-template-card
            grid_options:
              columns: 4
            icon: >-
              {% set n = states('sensor.shellypro3em_38182bdee0e0_leistung') |
              float(0) %}{{ 'mdi:transmission-tower-export' if n < 0 else
              'mdi:transmission-tower-import' }}
            icon_color: >-
              {% set n = states('sensor.shellypro3em_38182bdee0e0_leistung') |
              float(0) %}{{ 'green' if n < 0 else 'orange' }}
            primary: >-
              {% set n = (states('sensor.shellypro3em_38182bdee0e0_leistung') |
              float(0)) | abs %}{% if n >= 1000 %}{{ (n / 1000) | round(2) }}
              kW{% else %}{{ n | round(0) | int }} W{% endif %}
            secondary: >-
              {{ 'Einspeisung' if
              states('sensor.shellypro3em_38182bdee0e0_leistung') | float(0) < 0
              else 'Netzbezug' }}
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: '#energie'
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  --card-primary-font-size: 18px;
                  --card-primary-font-weight: 700;
                  --card-secondary-font-size: 12px;
                }
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Haustür
            heading_style: title
            icon: mdi:doorbell-video
          - type: picture-entity
            entity: camera.tuerklingel_standardauflosung
            camera_view: auto
            aspect_ratio: '16:9'
            show_name: false
            show_state: false
            tap_action:
              action: navigate
              navigation_path: '#tuerklingel'
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  overflow: hidden;
                  transition: all 0.3s ease;
                  {% if is_state('binary_sensor.tuerklingel_person','on') %}
                  border: 3px solid rgb(244, 67, 54);
                  box-shadow: 0 0 16px rgba(244, 67, 54, 0.55);
                  {% elif is_state('binary_sensor.tuerklingel_bewegung','on') %}
                  border: 3px solid rgb(255, 152, 0);
                  box-shadow: 0 0 12px rgba(255, 152, 0, 0.45);
                  {% else %}
                  border: 3px solid transparent;
                  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
                  {% endif %}
                }
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:bell-ring
                icon_color: >-
                  {{ 'red' if
                  is_state('binary_sensor.tuerklingel_besucher','on') else
                  'grey' }}
                content: >-
                  {{ 'Es klingelt!' if
                  is_state('binary_sensor.tuerklingel_besucher','on') else
                  'Ruhig' }}
              - type: template
                icon: mdi:account
                icon_color: >-
                  {{ 'orange' if
                  is_state('binary_sensor.tuerklingel_person','on') else 'grey'
                  }}
                content: >-
                  {{ 'Person an der Tür' if
                  is_state('binary_sensor.tuerklingel_person','on') else 'Keine
                  Person' }}
              - type: template
                icon: mdi:motion-sensor
                icon_color: >-
                  {{ 'orange' if
                  is_state('binary_sensor.tuerklingel_bewegung','on') else
                  'grey' }}
                content: >-
                  {{ 'Bewegung' if
                  is_state('binary_sensor.tuerklingel_bewegung','on') else
                  'Keine Bewegung' }}
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außenkameras
            heading_style: title
            icon: mdi:cctv
            badges:
              - type: entity
                entity: binary_sensor.vorne_rechts_person
                name: Vorne rechts
                color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.vorne_rechts_person
                    state: 'on'
              - type: entity
                entity: binary_sensor.vorne_links_person
                name: Vorne links
                color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.vorne_links_person
                    state: 'on'
              - type: entity
                entity: binary_sensor.hinterm_haus_duo_person
                name: Hinterm Haus
                color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.hinterm_haus_duo_person
                    state: 'on'
              - type: entity
                entity: binary_sensor.west_person
                name: West
                color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.west_person
                    state: 'on'
          - type: picture-entity
            grid_options:
              columns: 6
            entity: camera.vorne_rechts_standardauflosung
            camera_view: auto
            aspect_ratio: '16:9'
            name: Vorne rechts
            show_state: false
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  overflow: hidden;
                  transition: all 0.3s ease;
                  {% if is_state('binary_sensor.vorne_rechts_person','on') %}
                  border: 3px solid rgb(244, 67, 54);
                  box-shadow: 0 0 16px rgba(244, 67, 54, 0.55);
                  {% elif is_state('binary_sensor.vorne_rechts_bewegung','on') %}
                  border: 3px solid rgb(255, 152, 0);
                  box-shadow: 0 0 12px rgba(255, 152, 0, 0.45);
                  {% else %}
                  border: 3px solid transparent;
                  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
                  {% endif %}
                }
          - type: picture-entity
            grid_options:
              columns: 6
            entity: camera.vorne_links_standardauflosung
            camera_view: auto
            aspect_ratio: '16:9'
            name: Vorne links
            show_state: false
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  overflow: hidden;
                  transition: all 0.3s ease;
                  {% if is_state('binary_sensor.vorne_links_person','on') %}
                  border: 3px solid rgb(244, 67, 54);
                  box-shadow: 0 0 16px rgba(244, 67, 54, 0.55);
                  {% elif is_state('binary_sensor.vorne_links_bewegung','on') %}
                  border: 3px solid rgb(255, 152, 0);
                  box-shadow: 0 0 12px rgba(255, 152, 0, 0.45);
                  {% else %}
                  border: 3px solid transparent;
                  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
                  {% endif %}
                }
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Alle Kameras
            icon: mdi:grid
            tap_action:
              action: navigate
              navigation_path: /zuhause-neu/kameras
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außenbeleuchtung
            heading_style: title
            icon: mdi:spotlight-beam
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: light.vorne_links_flutlicht
            name: Vorne links
            icon: mdi:spotlight-beam
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: light.hinterm_haus_duo_flutlicht
            name: Hinterm Haus
            icon: mdi:spotlight-beam
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: light.west_flutlicht
            name: West
            icon: mdi:spotlight-beam
            show_state: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Wohnzimmer
            heading_style: title
            icon: mdi:sofa
          - type: conditional
            conditions:
              - condition: state
                entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
                state_not: 'off'
              - condition: state
                entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
                state_not: unavailable
              - condition: state
                entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
                state_not: standby
            card:
              type: custom:mushroom-media-player-card
              entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
              name: Fernseher
              icon: mdi:television-play
              use_media_info: true
              show_volume_level: true
              media_controls:
                - play_pause_stop
                - previous
                - next
              volume_controls:
                - volume_buttons
                - volume_mute
              card_mod:
                style: |
                  ha-card { border-radius: 20px; }
          - type: conditional
            conditions:
              - condition: state
                entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
                state:
                  - 'off'
                  - standby
                  - unavailable
            card:
              type: custom:bubble-card
              card_type: button
              button_type: name
              entity: media_player.samsung_cu6979_65_wohnzimmer_gu65cu6979uxzg
              name: Fernseher aus
              icon: mdi:television-off
              tap_action:
                action: more-info
      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#sicherheit'
            name: Sicherheit
            icon: mdi:shield-home
            cards:
              - type: custom:mushroom-template-card
                primary: >-
                  {% set rm =
                  expand('binary_sensor.eg_flur_haustur_rauch','binary_sensor.eg_flur_treppe_rauch','binary_sensor.eleano_rauch','binary_sensor.mattia_rauch','binary_sensor.og_flur_rauch')
                  %}{% set alarm = rm | selectattr('state','eq','on') | list
                  %}{% set weg = rm | rejectattr('state','in',['on','off']) |
                  list %}{% if alarm | count > 0 %}Rauch erkannt{% elif weg |
                  count > 0 %}{{ weg | count }} Melder offline{% else %}5
                  Rauchmelder OK{% endif %}
                secondary: >-
                  {% set b =
                  ['sensor.eg_flur_haustur_batteriestatus','sensor.eg_flur_treppe_batteriestatus','sensor.eleano_batteriestatus','sensor.mattia_batteriestatus','sensor.og_flur_batteriestatus']
                  %}{% set low = b | map('states') | map('float', 100) |
                  select('lt', 20) | list | count %}{{ 'Alle Batterien in
                  Ordnung' if low == 0 else low ~ ' Melder mit schwacher
                  Batterie' }}
                icon: mdi:shield-check
                icon_color: >-
                  {% set rm =
                  expand('binary_sensor.eg_flur_haustur_rauch','binary_sensor.eg_flur_treppe_rauch','binary_sensor.eleano_rauch','binary_sensor.mattia_rauch','binary_sensor.og_flur_rauch')
                  %}{% if rm | selectattr('state','eq','on') | list | count > 0
                  %}red{% elif rm | rejectattr('state','in',['on','off']) | list
                  | count > 0 %}orange{% else %}green{% endif %}
              - type: heading
                heading: Rauchmelder
                heading_style: title
                icon: mdi:smoke-detector-variant
              - type: grid
                columns: 1
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    entity: binary_sensor.eg_flur_haustur_rauch
                    primary: EG Flur Haustür
                    secondary: >-
                      {% if states('binary_sensor.eg_flur_haustur_rauch') not in
